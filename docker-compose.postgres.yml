services:
  publisher:
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pushpage}
      DB_USER: ${DB_USER:-pushpage}
      DB_PASSWORD: ${DB_PASSWORD:-pushpage}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pushpage}
      POSTGRES_USER: ${DB_USER:-pushpage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pushpage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pushpage} -d ${DB_NAME:-pushpage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
