services:
  publisher:
    build:
      context: .
      dockerfile: publisher/Dockerfile
    environment:
      BASE_URL: ${BASE_URL:-http://localhost/pages}
      PORT: ${PORT:-8080}
    volumes:
      - pages:/var/www/pages
      - data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - pages:/var/www/pages:ro
    depends_on:
      - publisher
    restart: unless-stopped

volumes:
  pages:
  data:
