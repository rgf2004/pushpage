services:
  publisher:
    image: rgf2004/pushpage-publisher:${IMAGE_TAG:-latest}
    environment:
      PLANS_ENABLED: ${PLANS_ENABLED:-false}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      APP_SERVER_URL: ${APP_SERVER_URL:-http://localhost:8080}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-1MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-10MB}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-pushpage}
      DB_USER: ${DB_USER:-pushpage}
      DB_PASSWORD: ${DB_PASSWORD:-pushpage}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@pushpage.link}
      EMAIL_VERIFICATION_TOKEN_TTL_HOURS: ${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:-24}
      EMAIL_VERIFICATION_RATE_LIMIT_PER_MINUTE: ${EMAIL_VERIFICATION_RATE_LIMIT_PER_MINUTE:-1}
      EMAIL_RESEND_IP_RATE_LIMIT_RPM: ${EMAIL_RESEND_IP_RATE_LIMIT_RPM:-5}
    volumes:
      - ./data/pages:/var/www/pages
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: rgf2004/pushpage-nginx:${IMAGE_TAG:-latest}
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./data/pages:/var/www/pages:ro
    depends_on:
      - publisher
    restart: unless-stopped

  mcp:
    image: rgf2004/pushpage-mcp:${IMAGE_TAG:-latest}
    environment:
      PUSHPAGE_URL: http://publisher:8080
    depends_on:
      - publisher
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pushpage}
      POSTGRES_USER: ${DB_USER:-pushpage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pushpage}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pushpage} -d ${DB_NAME:-pushpage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
