version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /publisher
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    ignore:
      # Stay on JDK 25.x — block bumps to JDK 26+ or Maven 4+
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
