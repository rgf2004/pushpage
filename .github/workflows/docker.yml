name: Build and Push Docker Image

on:
  push:
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MINOR=$(echo $VERSION | cut -d. -f2)
          NEXT_MINOR=$((MINOR + 1))
          MAJOR=$(echo $VERSION | cut -d. -f1)
          echo "VERSION=$VERSION"                                     >> $GITHUB_ENV
          echo "NEXT_SNAPSHOT=${MAJOR}.${NEXT_MINOR}.0-SNAPSHOT"     >> $GITHUB_ENV

      - name: Set release version in pom.xml
        run: mvn -B versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (publisher)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: rgf2004/pushpage-publisher
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push publisher
        uses: docker/build-push-action@v7
        with:
          context: .
          file: publisher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (nginx)
        id: meta-nginx
        uses: docker/metadata-action@v6
        with:
          images: rgf2004/pushpage-nginx
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push nginx
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          file: nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump to next snapshot version
        run: mvn -B versions:set -DnewVersion=${{ env.NEXT_SNAPSHOT }} -DgenerateBackupPoms=false

      - name: Commit next snapshot version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/bump-version-${{ env.NEXT_SNAPSHOT }}"
          git checkout -b "$BRANCH"
          git add pom.xml
          git commit -m "chore: bump version to ${{ env.NEXT_SNAPSHOT }}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: bump version to ${{ env.NEXT_SNAPSHOT }}" \
            --body "Automated version bump after releasing \`${{ env.VERSION }}\`." \
            --base main \
            --head "$BRANCH")
          gh pr merge "$PR_URL" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
