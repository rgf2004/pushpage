<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · pushpage</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            text-align: center;
        }

        .error-code {
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -.06em;
            color: var(--border-soft);
            margin-bottom: 24px;
            user-select: none;
        }

        .error-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -.02em;
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: .95rem;
            color: var(--text-muted);
            max-width: 400px;
            line-height: 1.65;
            margin-bottom: 36px;
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="/" class="logo">push<span>page</span></a>
        <nav class="site-nav">
            <a href="/docs" class="nav-link">Docs</a>
            <a href="/dashboard" class="nav-link">Dashboard</a>
        </nav>
        <div class="header-actions">
            <a href="/dashboard" class="btn btn-ghost btn-sm">Sign in</a>
            <a href="/dashboard" class="btn btn-primary btn-sm">Get started</a>
        </div>
    </div>
</header>

<main>
    <div class="error-code">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-desc">
        The page you're looking for doesn't exist. It may have expired,
        been deleted, or the link may be incorrect.
    </p>
    <a href="/" class="btn btn-secondary">← Back to home</a>
</main>

<footer>
    <div class="footer-inner">
        <div class="footer-bottom" style="border:none;padding:0">
            &copy; 2026 pushpage &nbsp;·&nbsp; Open source under MIT
        </div>
    </div>
</footer>

</body>
</html>
