<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · pushpage</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 24px 40px;
            border-bottom: 1px solid #21262d;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #58a6ff;
            letter-spacing: -.01em;
            text-decoration: none;
        }

        .logo span { color: #e6edf3; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            text-align: center;
        }

        .code {
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -.04em;
            color: #21262d;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .description {
            font-size: 1rem;
            color: #8b949e;
            max-width: 440px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: .95rem;
            font-weight: 500;
            text-decoration: none;
            transition: opacity .15s;
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
        }

        .btn:hover { opacity: .82; }

        footer {
            padding: 20px 40px;
            border-top: 1px solid #21262d;
            text-align: center;
            font-size: .8rem;
            color: #484f58;
        }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">push<span>page</span></a>
</header>

<main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p class="description">
        The page you're looking for doesn't exist. It may have expired,
        been deleted, or the link may be incorrect.
    </p>
    <a href="/" class="btn">← Back to home</a>
</main>

<footer>pushpage · homelab internal</footer>

</body>
</html>
