<style>
    html { padding-top: 36px !important; }
    #pp-bar {
        position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; z-index: 2147483647 !important;
        box-sizing: border-box; height: 36px !important; padding: 0 12px;
        display: flex !important; visibility: visible !important; opacity: 1 !important; align-items: center; gap: 12px;
        background: #fff !important; border-bottom: 1px solid #e2e8f0;
        font: 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #64748b;
    }
    #pp-bar a { color: #2563eb; text-decoration: none; font-weight: 600; }
    #pp-bar a.pp-r { color: #94a3b8; font-weight: 400; }
    #pp-bar a { display: inline !important; visibility: visible !important; }
    #pp-bar .pp-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #pp-bar button { border: 0; background: none; cursor: pointer; font-size: 18px; line-height: 1; color: #94a3b8; }
    @media (max-width: 520px) { #pp-bar .pp-t { display: none; } }
    @media print { #pp-bar { display: none; } html { padding-top: 0 !important; } }
</style>
<div id="pp-bar">
    <a href="/" target="_blank" rel="noopener">pushpage</a>
    <span class="pp-t">Published with pushpage. AI agents publish HTML pages and get a shareable link.</span>
    <a href="/" target="_blank" rel="noopener">Publish yours</a>
    <a id="pp-report" class="pp-r" href="/report" target="_blank" rel="noopener noreferrer" title="Report this page as abusive">Report</a>
    <button type="button" aria-label="Hide bar" onclick="this.parentNode.remove();document.documentElement.style.paddingTop=0">&times;</button>
</div>
<script>
(function () {
    try {
        var m = /^\/pages\/([a-zA-Z0-9]+)\.html$/.exec(location.pathname);
        var a = document.getElementById('pp-report');
        // Always absolute from location.origin: a <base href> in the host page cannot change it.
        // The static href="/report" stays only as a no-JS fallback.
        if (a) a.href = location.origin + '/report' + (m ? '?page=' + m[1] : '');
    } catch (e) {}
})();
</script>
