# Brute-force protection for credential endpoints (per client IP).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    absolute_redirect off;

    # Never let another origin frame the dashboard or docs (clickjacking, and
    # a hostile page reaching into the dashboard's sessionStorage via a frame).
    # NOTE: add_header is not inherited into a location that defines its own,
    # so locations that need extra headers must repeat these if framing matters.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    error_page 404 /404.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # LLM/agent discoverability
    location = /llms.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # Crawler directives
    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
    }

    # Landing page
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Dashboard
    location = /dashboard {
        root /usr/share/nginx/html;
        try_files /dashboard.html =404;
    }

    # Documentation
    location = /docs {
        root /usr/share/nginx/html;
        try_files /docs.html =404;
    }

    # Terms of Use
    location = /terms {
        root /usr/share/nginx/html;
        try_files /terms.html =404;
    }

    # Shared static assets (theme.css, etc.)
    location /static/ {
        root /usr/share/nginx/html;
    }

    # Static published HTML files — served directly by nginx from the shared volume.
    # Pages are untrusted user content on the same origin as the dashboard and API,
    # so they run in a CSP sandbox WITHOUT allow-same-origin: scripts still run, but
    # in an opaque origin that cannot read the dashboard's sessionStorage or make
    # same-origin requests to /api. Do not add allow-same-origin here.
    location ~ ^/pages/[a-zA-Z0-9]+\.html$ {
        root /var/www;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-forms allow-modals" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Login / signup: rate-limited per IP to blunt password guessing
    location ~ ^/api/auth/(login|signup)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://publisher:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Everything under /api/ goes to Spring Boot — it decides the routing
    # (swagger-ui and /v3/api-docs are also under /api/ via context-path)
    location /api/ {
        proxy_pass http://publisher:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # MCP server
    location /mcp {
        proxy_pass http://mcp:8000/mcp;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for streamable-http / SSE
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

}
