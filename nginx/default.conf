# Brute-force protection for credential endpoints (per client IP). Password reset gets its
# own bucket so failed logins can't lock someone out of the reset flow they'd use next.
map $uri $auth_bucket {
    ~^/api/auth/(forgot|reset)-password$ reset;
    default                              login;
}
limit_req_zone $binary_remote_addr$auth_bucket zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    absolute_redirect off;

    # Deny framing. A location with its own add_header drops these (nginx quirk).
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    error_page 404 /404.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # LLM/agent discoverability
    location = /llms.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # Crawler directives
    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
    }

    # Landing page
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Dashboard (expires -1 = no-cache; add_header would drop the headers above)
    location = /dashboard {
        root /usr/share/nginx/html;
        expires -1;
        try_files /dashboard.html =404;
    }

    # Documentation
    location = /docs {
        root /usr/share/nginx/html;
        try_files /docs.html =404;
    }

    # Terms of Use
    location = /terms {
        root /usr/share/nginx/html;
        try_files /terms.html =404;
    }

    # Shared static assets (theme.css, etc.)
    location /static/ {
        root /usr/share/nginx/html;
    }

    # Published pages — untrusted user HTML, sandboxed. Never add allow-same-origin.
    location ~ ^/pages/[a-zA-Z0-9]+\.html$ {
        root /var/www;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-forms allow-modals" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # pushpage bar injected into every published page as it is served. The CSP above still
        # sandboxes the page, so the bar is just markup inside the untrusted document. Replacement
        # strings may not contain "$" (nginx variable) or single quotes.
        sub_filter_once on;
        sub_filter '</head>' '<style>html{padding-top:36px!important}#pp-bar{position:fixed;top:0;left:0;right:0;z-index:2147483647;box-sizing:border-box;height:36px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#fff;border-bottom:1px solid #e2e8f0;font:13px/1 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#64748b}#pp-bar a{color:#2563eb;text-decoration:none;font-weight:600}#pp-bar .pp-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pp-bar button{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;color:#94a3b8}@media(max-width:520px){#pp-bar .pp-t{display:none}}@media print{#pp-bar{display:none}html{padding-top:0!important}}</style></head>';
        sub_filter '</body>' '<div id="pp-bar"><a href="/" target="_blank" rel="noopener">pushpage</a><span class="pp-t">Published with pushpage. AI agents publish HTML pages and get a shareable link.</span><a href="/" target="_blank" rel="noopener">Publish yours</a><button type="button" aria-label="Hide bar" onclick="this.parentNode.remove();document.documentElement.style.paddingTop=0">&times;</button></div></body>';
        try_files $uri =404;
    }

    # Credential endpoints: rate-limited per IP to blunt password guessing and token probing
    location ~ ^/api/auth/(login|signup|forgot-password|reset-password)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://publisher:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Everything under /api/ goes to Spring Boot — it decides the routing
    # (swagger-ui and /v3/api-docs are also under /api/ via context-path)
    location /api/ {
        proxy_pass http://publisher:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # MCP server
    location /mcp {
        proxy_pass http://mcp:8000/mcp;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for streamable-http / SSE
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

}
