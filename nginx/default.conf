server {
    listen 80;
    server_name _;

    absolute_redirect off;

    error_page 404 /404.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # LLM/agent discoverability
    location = /llms.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # Landing page
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Dashboard
    location = /dashboard {
        root /usr/share/nginx/html;
        try_files /dashboard.html =404;
    }

    # Shared static assets (theme.css, etc.)
    location /static/ {
        root /usr/share/nginx/html;
    }

    # Static published HTML files — served directly by nginx from the shared volume
    location ~ ^/pages/[a-zA-Z0-9]+\.html$ {
        root /var/www;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Swagger UI 5 registers a service worker scoped to the origin root.
    # Serve a no-op worker directly so the browser stops retrying and
    # Swagger can finish loading its spec.
    location = /serviceWorker.js {
        default_type application/javascript;
        return 200 "self.addEventListener('install', () => self.skipWaiting());";
    }

    # Silence Chrome DevTools discovery request
    location = /.well-known/appspecific/com.chrome.devtools.json {
        return 204;
    }

    # Everything under /api/ goes to Spring Boot — it decides the routing
    # (swagger-ui and /v3/api-docs are also under /api/ via context-path)
    location /api/ {
        proxy_pass http://publisher:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # MCP server
    location /mcp {
        proxy_pass http://mcp:8000/mcp;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for streamable-http / SSE
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

}
