server {
    listen 80;
    server_name _;

    # Static published HTML files — nginx serves directly from shared volume
    location ~ ^/pages/[a-zA-Z0-9]+\.html$ {
        root /var/www;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Publisher API: POST /publish
    location /publish {
        proxy_pass http://publisher:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
    }

    # Publisher API: GET /pages (JSON listing) + DELETE /pages/{id}
    location /pages {
        proxy_pass http://publisher:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Publisher API: GET /health
    location /health {
        proxy_pass http://publisher:8080;
        proxy_set_header Host $host;
    }

    # Index page — served by Spring Boot
    location = / {
        proxy_pass http://publisher:8080;
        proxy_set_header Host $host;
    }
}
