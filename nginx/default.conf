# Brute-force protection for credential endpoints (per client IP). Password reset gets its
# own bucket so failed logins can't lock someone out of the reset flow they'd use next.
map $uri $auth_bucket {
    ~^/api/auth/(forgot|reset)-password$ reset;
    default                              login;
}
limit_req_zone $binary_remote_addr$auth_bucket zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    absolute_redirect off;

    # Real client IP when behind a proxy/tunnel. Rendered at start from TRUSTED_PROXIES and
    # REAL_IP_HEADER (nginx/20-realip.sh); empty when unset.
    include /etc/nginx/realip.conf;

    # Deny framing. A location with its own add_header drops these (nginx quirk).
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    error_page 404 /404.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Hidden files and directories (.env, .git, .aws, ...) are never served; .well-known stays
    # reachable. Declared before the other regex locations so it wins for any path.
    location ~ /\.(?!well-known) {
        access_log off;
        log_not_found off;
        # With a body, the global 404 error_page (whose internal redirect re-enables logging) is skipped.
        default_type text/plain;
        return 404 "Not Found\n";
    }

    # LLM/agent discoverability
    location = /llms.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # Crawler directives
    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
    }

    # Landing page
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Dashboard (expires -1 = no-cache; add_header would drop the headers above)
    location = /dashboard {
        root /usr/share/nginx/html;
        expires -1;
        try_files /dashboard.html =404;
    }

    # Documentation
    location = /docs {
        root /usr/share/nginx/html;
        try_files /docs.html =404;
    }

    # Terms of Use
    location = /terms {
        root /usr/share/nginx/html;
        try_files /terms.html =404;
    }

    # Browsers request /favicon.ico by default (e.g. on published pages, which declare no icon)
    location = /favicon.ico {
        alias /usr/share/nginx/html/static/favicon.ico;
    }

    # Shared static assets (theme.css, etc.)
    location /static/ {
        root /usr/share/nginx/html;
    }

    # Published pages — untrusted user HTML, sandboxed. Never add allow-same-origin.
    location ~ ^/pages/[a-zA-Z0-9]+\.html$ {
        root /var/www;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-forms allow-modals" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # pushpage bar (static/pp-bar.html). Never enable SSI here: it would run on user HTML.
        add_after_body /static/pp-bar.html;
        try_files $uri =404;
    }

    # Credential endpoints: rate-limited per IP to blunt password guessing and token probing
    location ~ ^/api/auth/(login|signup|forgot-password|reset-password)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://publisher:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Everything under /api/ goes to Spring Boot — it decides the routing
    # (swagger-ui and /v3/api-docs are also under /api/ via context-path)
    location /api/ {
        proxy_pass http://publisher:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # MCP server
    location /mcp {
        proxy_pass http://mcp:8000/mcp;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for streamable-http / SSE
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

}
