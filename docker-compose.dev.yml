services:
  publisher:
    build:
      context: .
      dockerfile: publisher/Dockerfile
    environment:
      APP_SERVER_URL: ${APP_SERVER_URL:-http://localhost:8080}
    volumes:
      - pages:/var/www/pages
      - data:/data
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - pages:/var/www/pages:ro
    depends_on:
      - publisher
    restart: unless-stopped

volumes:
  pages:
  data:
