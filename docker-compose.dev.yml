services:
  publisher:
    build:
      context: .
      dockerfile: publisher/Dockerfile
    environment:
      APP_SERVER_URL: ${APP_SERVER_URL:-http://localhost:8080}
      # Uncomment to use PostgreSQL instead of the default SQLite:
      # SPRING_PROFILES_ACTIVE: postgres
      # DB_HOST: postgres
      # DB_NAME: ${DB_NAME:-pushpage}
      # DB_USER: ${DB_USER:-pushpage}
      # DB_PASSWORD: ${DB_PASSWORD:-pushpage}
    volumes:
      - pages:/var/www/pages
    # Uncomment when using PostgreSQL:
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - pages:/var/www/pages:ro
    depends_on:
      - publisher
    restart: unless-stopped

  # Uncomment to enable the MCP server:
  # mcp:
  #   build:
  #     context: .
  #     dockerfile: mcp/Dockerfile
  #   environment:
  #     PUSHPAGE_URL: http://publisher:8080
  #     PUSHPAGE_API_KEY: ${PUSHPAGE_API_KEY}
  #   depends_on:
  #     - publisher
  #   restart: unless-stopped
  #   profiles:
  #     - mcp

  # Uncomment to use PostgreSQL:
  # postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_DB: ${DB_NAME:-pushpage}
  #     POSTGRES_USER: ${DB_USER:-pushpage}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-pushpage}
  #   tmpfs:
  #     - /var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pushpage} -d ${DB_NAME:-pushpage}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  #   restart: unless-stopped

volumes:
  pages:
