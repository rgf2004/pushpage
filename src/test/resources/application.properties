spring.application.name=pushpage

# Use in-memory SQLite — no file system dependency
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=5000

server.port=8080
server.servlet.context-path=/api

app.server-url=http://localhost:8080
app.base-url=${app.server-url}/pages
app.pages-dir=${java.io.tmpdir}/pushpage-test-pages
app.max-file-size=1MB
