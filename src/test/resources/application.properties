spring.application.name=pushpage

server.port=8080
server.servlet.context-path=/api

app.server-url=http://localhost:8080
app.base-url=${app.server-url}/pages
app.pages-dir=${java.io.tmpdir}/pushpage-test-pages
app.max-file-size=1MB
app.jwt.secret=test-jwt-secret-for-all-tests-minimum-32-chars-xxxxxxxx

spring.servlet.multipart.max-file-size=128KB
spring.servlet.multipart.max-request-size=128KB
