# NOTE: db/migration/cloud is NOT wired up via spring.flyway.locations. FlywayConfig
# builds Flyway directly (Flyway.configure()...load()) and never reads spring.flyway.*
# properties, so that property would be inert here. Cloud migrations are picked up
# because Flyway's default location, classpath:db/migration, is scanned recursively and
# db/migration/cloud is a subdirectory of it.

# SMTP is provider-agnostic: Mailtrap, Resend, SES, Sendgrid, Postmark, etc. all
# expose an SMTP endpoint, so switching providers only means changing these values.
spring.mail.host=${EMAIL_SMTP_HOST:}
spring.mail.port=${EMAIL_SMTP_PORT:587}
spring.mail.username=${EMAIL_SMTP_USERNAME:}
spring.mail.password=${EMAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.from=${EMAIL_FROM:no-reply@pushpage.link}
app.email.verification-token-ttl-hours=${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}

# DoS/abuse protection around sendVerificationEmail (see docs/email-verification.md)
app.email.verification-rate-limit-per-minute=${EMAIL_VERIFICATION_RATE_LIMIT_PER_MINUTE:1}
app.email.resend-ip-rate-limit-per-minute=${EMAIL_RESEND_IP_RATE_LIMIT_RPM:5}
