<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{TITLE}}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <meta name="referrer" content="no-referrer">
    {{META}}
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        html, body { height: 100%; }
        body { overflow: hidden; }
        .viewer-bar {
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 40px;
            padding: 0 12px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-muted);
        }
        .viewer-bar .viewer-logo { font-weight: 700; color: var(--text); text-decoration: none; }
        .viewer-bar .viewer-logo span { color: var(--accent); }
        .viewer-bar .viewer-tagline { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .viewer-bar .viewer-cta { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
        .viewer-bar .viewer-cta:hover { text-decoration: underline; }
        .viewer-bar button {
            border: 0; background: none; cursor: pointer; font-size: 18px; line-height: 1;
            color: var(--text-dim); padding: 4px 6px; border-radius: var(--radius);
        }
        .viewer-bar button:hover { background: var(--bg-input); color: var(--text); }
        .viewer-frame { flex: 1; width: 100%; border: 0; background: #fff; }
        body.bar-hidden .viewer-bar { display: none; }
        @media (max-width: 520px) { .viewer-tagline { display: none; } .viewer-bar .viewer-cta { margin-left: auto; } }
        @media print { .viewer-bar { display: none; } body { overflow: visible; } }
    </style>
</head>
<body>
    <header class="viewer-bar">
        <a href="/" class="viewer-logo" target="_blank" rel="noopener">push<span>page</span></a>
        <span class="viewer-tagline">Published with pushpage. AI agents publish HTML pages and get a shareable link.</span>
        <a href="/" class="viewer-cta" target="_blank" rel="noopener">Publish yours</a>
        <button type="button" id="dismiss" aria-label="Hide header" title="Hide header">&times;</button>
    </header>
    <iframe class="viewer-frame" src="/pages/{{ID}}.html" title="{{TITLE}}"
            sandbox="allow-scripts allow-popups allow-forms allow-modals" referrerpolicy="no-referrer"></iframe>
    <script>
        // Forward #fragment to the page so shared anchor links (/p/{id}#section) still scroll.
        var frame = document.querySelector('.viewer-frame');
        function syncHash() {
            if (location.hash) { frame.src = '/pages/{{ID}}.html' + location.hash; }
        }
        syncHash();
        window.addEventListener('hashchange', syncHash);
        document.getElementById('dismiss').addEventListener('click', function () {
            document.body.classList.add('bar-hidden');
        });
    </script>
</body>
</html>
