spring.application.name=pushpage

spring.datasource.url=jdbc:sqlite:${DB_PATH:/data/pages.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=5000

server.port=8080
server.servlet.context-path=/api

app.server-url=${APP_SERVER_URL:http://localhost:8080}
app.base-url=${app.server-url}/pages
app.pages-dir=${PAGES_DIR:/var/www/pages}
