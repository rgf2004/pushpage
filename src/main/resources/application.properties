spring.application.name=pushpage

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pushpage}
spring.datasource.username=${DB_USER:pushpage}
spring.datasource.password=${DB_PASSWORD:pushpage}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000


server.port=8080
server.servlet.context-path=/api

app.server-url=${APP_SERVER_URL:http://localhost:8080}
app.base-url=${app.server-url}/pages
app.pages-dir=${PAGES_DIR:/var/www/pages}

app.max-file-size=${MAX_FILE_SIZE:1MB}

spring.servlet.multipart.max-file-size=${MAX_REQUEST_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

app.cleanup.retention-days=${CLEANUP_RETENTION_DAYS:30}
app.cleanup.schedule=${CLEANUP_SCHEDULE:0 0 * * * *}

app.guest.expiration-minutes=30

app.rate-limit.user-requests-per-minute=${RATE_LIMIT_USER_RPM:10}
app.rate-limit.guest-requests-per-minute=${RATE_LIMIT_GUEST_RPM:5}

app.jwt.secret=${JWT_SECRET:change-me-set-JWT_SECRET-in-production}
app.jwt.expiration-hours=24

app.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}

# Optional features, both off by default (see docs/configuration.md).
app.features.plans.enabled=${PLANS_ENABLED:false}
app.features.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}

# SMTP is provider-agnostic: Mailtrap, Resend, SES, Sendgrid, Postmark, etc. all
# expose an SMTP endpoint, so switching providers only means changing these values.
# Only used when EMAIL_VERIFICATION_ENABLED=true.
spring.mail.host=${EMAIL_SMTP_HOST:}
spring.mail.port=${EMAIL_SMTP_PORT:587}
spring.mail.username=${EMAIL_SMTP_USERNAME:}
spring.mail.password=${EMAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.from=${EMAIL_FROM:no-reply@pushpage.link}
app.email.verification-token-ttl-hours=${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}

# DoS/abuse protection around sendVerificationEmail (see docs/email-verification.md)
app.email.verification-rate-limit-per-minute=${EMAIL_VERIFICATION_RATE_LIMIT_PER_MINUTE:1}
app.email.resend-ip-rate-limit-per-minute=${EMAIL_RESEND_IP_RATE_LIMIT_RPM:5}
